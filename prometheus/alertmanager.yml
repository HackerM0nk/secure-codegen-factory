global:
  resolve_timeout: 5m

route:
  receiver: devfactory-webhook
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: devfactory-webhook
      group_wait: 10s
      repeat_interval: 15m
    - match:
        severity: warning
      receiver: devfactory-webhook
      group_wait: 30s

receivers:
  - name: devfactory-webhook
    webhook_configs:
      - url: http://host.docker.internal:4100/api/security/alert-webhook
        send_resolved: true
        max_alerts: 10

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
