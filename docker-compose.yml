version: "3.9"

networks:
  devfactory-v2:
    name: devfactory-net
    driver: bridge

volumes:
  pgdata-v2:
  lsdata-v2:
  keycloak-data-v2:

services:
  postgres:
    image: postgres:16-alpine
    container_name: devfactory-v2-postgres
    restart: unless-stopped
    ports:
      - "5534:5432"
    environment:
      POSTGRES_USER: devfactory
      POSTGRES_PASSWORD: devfactory
      POSTGRES_DB: devfactory
    volumes:
      - pgdata-v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devfactory -d devfactory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - devfactory-v2

  redis:
    image: redis:7-alpine
    container_name: devfactory-v2-redis
    restart: unless-stopped
    ports:
      - "6480:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devfactory-v2

  localstack:
    image: localstack/localstack:3.8
    container_name: devfactory-v2-localstack
    ports:
      - "4666:4566"
    environment:
      SERVICES: s3,sqs,iam
      DEFAULT_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - lsdata-v2:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - devfactory-v2

  traefik:
    image: traefik:v3.0
    container_name: devfactory-v2-traefik
    restart: unless-stopped
    ports:
      - "8090:80"
      - "8190:8080"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=devfactory-net"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - devfactory-v2

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: devfactory-v2-keycloak
    restart: unless-stopped
    ports:
      - "8280:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/devfactory
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: devfactory
      KC_DB_PASSWORD: devfactory
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    command:
      - "start-dev"
      - "--import-realm"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - keycloak-data-v2:/opt/keycloak/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - devfactory-v2

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: devfactory-v2-jaeger
    restart: unless-stopped
    ports:
      - "16786:16686"
      - "4418:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - devfactory-v2

  prometheus:
    image: prom/prometheus:latest
    container_name: devfactory-v2-prometheus
    restart: unless-stopped
    ports:
      - "9190:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - devfactory-v2

  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: devfactory-v2-stripe-mock
    restart: unless-stopped
    ports:
      - "12211:12111"
    networks:
      - devfactory-v2
