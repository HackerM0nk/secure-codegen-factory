<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/><stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <marker id="a-red" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 1, 12 5, 0 9" fill="#dc2626"/>
    </marker>
    <marker id="a-purple" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 1, 12 5, 0 9" fill="#7c3aed"/>
    </marker>
    <marker id="a-orange" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 1, 12 5, 0 9" fill="#ea580c"/>
    </marker>
    <marker id="a-blue" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 1, 12 5, 0 9" fill="#2563eb"/>
    </marker>
    <marker id="a-green" markerWidth="14" markerHeight="10" refX="12" refY="5" orient="auto">
      <polygon points="0 1, 12 5, 0 9" fill="#059669"/>
    </marker>

    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="sh-sm" x="-2%" y="-4%" width="104%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="560" fill="#f8fafc" rx="16"/>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.3"/>
  </pattern>
  <rect width="1400" height="560" fill="url(#grid)" rx="16" opacity="0.5"/>

  <!-- Title -->
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Secure CodeGen</text>
  <text x="700" y="54" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b" letter-spacing="0.3">Defense-in-Depth Pipeline</text>

  <!-- Grouping brackets -->
  <line x1="80" y1="72" x2="570" y2="72" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.45"/>
  <rect x="230" y="64" width="190" height="17" rx="8" fill="#f8fafc"/>
  <text x="325" y="76" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ef4444" letter-spacing="1.5" opacity="0.6">PROMPT CONTROLS</text>

  <line x1="600" y1="72" x2="1360" y2="72" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.45"/>
  <rect x="855" y="64" width="250" height="17" rx="8" fill="#f8fafc"/>
  <text x="980" y="76" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3b82f6" letter-spacing="1.5" opacity="0.6">CODE &amp; RUNTIME CONTROLS</text>

  <!-- User -->
  <g transform="translate(18, 258)">
    <circle cx="28" cy="28" r="28" fill="url(#g-dark)" filter="url(#sh)"/>
    <circle cx="28" cy="20" r="8" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <path d="M12,42 Q12,32 28,32 Q44,32 44,42" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
    <text x="28" y="68" text-anchor="middle" font-size="10" fill="#475569" font-weight="600">User Prompt</text>
  </g>

  <!-- ═══ Phase 1: Pre-LLM Gate ═══ -->
  <g transform="translate(80, 88)">
    <!-- Single container with clipped header -->
    <rect width="220" height="420" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
    <rect width="220" height="40" rx="14" fill="url(#g-red)"/>
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="white">Pre-LLM Gate</text>

    <rect x="22" y="55" width="176" height="48" rx="10" fill="url(#g-red)" filter="url(#sh-sm)"/>
    <text x="110" y="84" text-anchor="middle" font-size="12" fill="white" font-weight="600">Input Firewall</text>

    <rect x="22" y="117" width="176" height="48" rx="10" fill="url(#g-red)" filter="url(#sh-sm)"/>
    <text x="110" y="146" text-anchor="middle" font-size="12" fill="white" font-weight="600">Injection Detector</text>

    <rect x="22" y="179" width="176" height="48" rx="10" fill="url(#g-red)" filter="url(#sh-sm)"/>
    <text x="110" y="208" text-anchor="middle" font-size="12" fill="white" font-weight="600">Intent Classifier</text>

    <rect x="22" y="241" width="176" height="48" rx="10" fill="url(#g-red)" filter="url(#sh-sm)"/>
    <text x="110" y="270" text-anchor="middle" font-size="12" fill="white" font-weight="600">Secret Detector</text>

    <rect x="22" y="303" width="176" height="48" rx="10" fill="url(#g-red)" filter="url(#sh-sm)"/>
    <text x="110" y="325" text-anchor="middle" font-size="11" fill="white" font-weight="600">System Prompt</text>
    <text x="110" y="339" text-anchor="middle" font-size="11" fill="white" font-weight="600">Hardening</text>

    <line x1="110" y1="103" x2="110" y2="117" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="165" x2="110" y2="179" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="227" x2="110" y2="241" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="289" x2="110" y2="303" stroke="#fca5a5" stroke-width="2" stroke-linecap="round"/>

    <rect x="70" y="370" width="80" height="26" rx="13" fill="#991b1b" filter="url(#sh-sm)"/>
    <text x="110" y="388" text-anchor="middle" font-size="11" fill="white" font-weight="700">5 layers</text>

    <rect x="22" y="55" width="176" height="3" rx="1.5" fill="white" opacity="0.25">
      <animate attributeName="y" values="55;348;55" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ARROW: User → Pre-LLM -->
  <line x1="74" y1="286" x2="80" y2="286" stroke="#dc2626" stroke-width="4" marker-end="url(#a-red)" stroke-linecap="round"/>

  <!-- ARROW: Pre-LLM → LLM (with pill label) -->
  <line x1="300" y1="298" x2="340" y2="298" stroke="#7c3aed" stroke-width="4" marker-end="url(#a-purple)" stroke-linecap="round"/>
  <rect x="304" y="280" width="32" height="16" rx="8" fill="#7c3aed" opacity="0.85"/>
  <text x="320" y="292" text-anchor="middle" font-size="8" fill="white" font-weight="600">pass</text>

  <!-- ═══ Phase 2: LLM Agent ═══ -->
  <g transform="translate(340, 88)">
    <rect width="220" height="420" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
    <rect width="220" height="40" rx="14" fill="url(#g-purple)"/>
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="white">LLM Agent</text>

    <rect x="22" y="70" width="176" height="52" rx="10" fill="url(#g-purple)" filter="url(#sh-sm)"/>
    <text x="110" y="93" text-anchor="middle" font-size="11" fill="white" font-weight="600">Multi-Provider</text>
    <text x="110" y="107" text-anchor="middle" font-size="11" fill="white" font-weight="600">Router</text>

    <rect x="22" y="148" width="176" height="52" rx="10" fill="url(#g-purple)" filter="url(#sh-sm)"/>
    <text x="110" y="171" text-anchor="middle" font-size="11" fill="white" font-weight="600">Trajectory</text>
    <text x="110" y="185" text-anchor="middle" font-size="11" fill="white" font-weight="600">Monitor</text>

    <rect x="22" y="226" width="176" height="52" rx="10" fill="url(#g-purple)" filter="url(#sh-sm)"/>
    <text x="110" y="249" text-anchor="middle" font-size="11" fill="white" font-weight="600">Behavioral</text>
    <text x="110" y="263" text-anchor="middle" font-size="11" fill="white" font-weight="600">Detector</text>

    <line x1="110" y1="122" x2="110" y2="148" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="200" x2="110" y2="226" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>

    <rect x="70" y="370" width="80" height="26" rx="13" fill="#5b21b6" filter="url(#sh-sm)"/>
    <text x="110" y="388" text-anchor="middle" font-size="11" fill="white" font-weight="700">3 layers</text>
  </g>

  <!-- ARROW: LLM → Post-LLM -->
  <line x1="560" y1="298" x2="600" y2="298" stroke="#ea580c" stroke-width="4" marker-end="url(#a-orange)" stroke-linecap="round"/>
  <rect x="564" y="280" width="32" height="16" rx="8" fill="#ea580c" opacity="0.85"/>
  <text x="580" y="292" text-anchor="middle" font-size="8" fill="white" font-weight="600">pass</text>

  <!-- ═══ Phase 3: Post-LLM Gate ═══ -->
  <g transform="translate(600, 88)">
    <rect width="220" height="420" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
    <rect width="220" height="40" rx="14" fill="url(#g-orange)"/>
    <text x="110" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="white">Post-LLM Gate</text>

    <rect x="22" y="55" width="176" height="48" rx="10" fill="url(#g-orange)" filter="url(#sh-sm)"/>
    <text x="110" y="84" text-anchor="middle" font-size="12" fill="white" font-weight="600">Output Filter</text>

    <rect x="22" y="117" width="176" height="48" rx="10" fill="url(#g-orange)" filter="url(#sh-sm)"/>
    <text x="110" y="146" text-anchor="middle" font-size="12" fill="white" font-weight="600">Package Filter</text>

    <rect x="22" y="179" width="176" height="48" rx="10" fill="url(#g-orange)" filter="url(#sh-sm)"/>
    <text x="110" y="208" text-anchor="middle" font-size="12" fill="white" font-weight="600">SAST Scanner</text>

    <rect x="22" y="241" width="176" height="48" rx="10" fill="url(#g-orange)" filter="url(#sh-sm)"/>
    <text x="110" y="270" text-anchor="middle" font-size="12" fill="white" font-weight="600">SCA + SBOM</text>

    <rect x="22" y="303" width="176" height="48" rx="10" fill="url(#g-orange)" filter="url(#sh-sm)"/>
    <text x="110" y="332" text-anchor="middle" font-size="12" fill="white" font-weight="600">Secret Scanner</text>

    <line x1="110" y1="103" x2="110" y2="117" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="165" x2="110" y2="179" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="227" x2="110" y2="241" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="289" x2="110" y2="303" stroke="#fdba74" stroke-width="2" stroke-linecap="round"/>

    <rect x="70" y="370" width="80" height="26" rx="13" fill="#c2410c" filter="url(#sh-sm)"/>
    <text x="110" y="388" text-anchor="middle" font-size="11" fill="white" font-weight="700">5 layers</text>

    <rect x="22" y="55" width="176" height="3" rx="1.5" fill="white" opacity="0.25">
      <animate attributeName="y" values="55;348;55" dur="3.5s" repeatCount="indefinite" begin="1.8s"/>
      <animate attributeName="opacity" values="0;0.35;0" dur="3.5s" repeatCount="indefinite" begin="1.8s"/>
    </rect>
  </g>

  <!-- ARROW: Post-LLM → Sandbox -->
  <line x1="820" y1="298" x2="860" y2="298" stroke="#2563eb" stroke-width="4" marker-end="url(#a-blue)" stroke-linecap="round"/>
  <rect x="822" y="280" width="36" height="16" rx="8" fill="#2563eb" opacity="0.85"/>
  <text x="840" y="292" text-anchor="middle" font-size="8" fill="white" font-weight="600">deploy</text>

  <!-- ═══ Phase 4: Sandboxed Workspace ═══ -->
  <g transform="translate(860, 88)">
    <rect width="220" height="420" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#sh)"/>
    <rect width="220" height="40" rx="14" fill="url(#g-blue)"/>
    <text x="110" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="white">Sandboxed Workspace</text>

    <rect x="22" y="62" width="176" height="52" rx="10" fill="url(#g-blue)" filter="url(#sh-sm)"/>
    <text x="110" y="85" text-anchor="middle" font-size="11" fill="white" font-weight="600">Docker / K8s</text>
    <text x="110" y="99" text-anchor="middle" font-size="11" fill="white" font-weight="600">Isolation</text>

    <rect x="22" y="138" width="176" height="48" rx="10" fill="url(#g-blue)" filter="url(#sh-sm)"/>
    <text x="110" y="167" text-anchor="middle" font-size="12" fill="white" font-weight="600">Tetragon eBPF</text>

    <rect x="22" y="210" width="176" height="48" rx="10" fill="url(#g-blue)" filter="url(#sh-sm)"/>
    <text x="110" y="239" text-anchor="middle" font-size="12" fill="white" font-weight="600">Cilium Network</text>

    <rect x="22" y="282" width="176" height="48" rx="10" fill="url(#g-blue)" filter="url(#sh-sm)"/>
    <text x="110" y="311" text-anchor="middle" font-size="12" fill="white" font-weight="600">OPA Gatekeeper</text>

    <line x1="110" y1="114" x2="110" y2="138" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="186" x2="110" y2="210" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="258" x2="110" y2="282" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>

    <rect x="70" y="370" width="80" height="26" rx="13" fill="#1d4ed8" filter="url(#sh-sm)"/>
    <text x="110" y="388" text-anchor="middle" font-size="11" fill="white" font-weight="700">4 layers</text>
  </g>

  <!-- ARROW: Sandbox → Detection -->
  <line x1="1080" y1="298" x2="1120" y2="298" stroke="#059669" stroke-width="4" marker-end="url(#a-green)" stroke-linecap="round"/>
  <rect x="1078" y="280" width="44" height="16" rx="8" fill="#059669" opacity="0.85"/>
  <text x="1100" y="292" text-anchor="middle" font-size="8" fill="white" font-weight="600">events</text>

  <!-- ═══ Phase 5: Detection & Response ═══ -->
  <g transform="translate(1120, 88)">
    <rect width="220" height="420" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" filter="url(#sh)"/>
    <rect width="220" height="40" rx="14" fill="url(#g-green)"/>
    <text x="110" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="white">Detection &amp; Response</text>

    <rect x="22" y="72" width="176" height="48" rx="10" fill="url(#g-green)" filter="url(#sh-sm)"/>
    <text x="110" y="101" text-anchor="middle" font-size="12" fill="white" font-weight="600">SIEM Engine</text>

    <rect x="22" y="150" width="176" height="52" rx="10" fill="url(#g-green)" filter="url(#sh-sm)"/>
    <text x="110" y="173" text-anchor="middle" font-size="11" fill="white" font-weight="600">Runtime</text>
    <text x="110" y="187" text-anchor="middle" font-size="11" fill="white" font-weight="600">Correlator</text>

    <rect x="22" y="230" width="176" height="52" rx="10" fill="url(#g-green)" filter="url(#sh-sm)"/>
    <text x="110" y="253" text-anchor="middle" font-size="11" fill="white" font-weight="600">Incident</text>
    <text x="110" y="267" text-anchor="middle" font-size="11" fill="white" font-weight="600">Response</text>

    <line x1="110" y1="120" x2="110" y2="150" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
    <line x1="110" y1="202" x2="110" y2="230" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>

    <rect x="70" y="370" width="80" height="26" rx="13" fill="#047857" filter="url(#sh-sm)"/>
    <text x="110" y="388" text-anchor="middle" font-size="11" fill="white" font-weight="700">3 layers</text>

    <!-- Alert pulse -->
    <circle cx="192" cy="256" r="5" fill="#059669">
      <animate attributeName="r" values="4;8;4" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottom flow labels -->
  <text x="190" y="535" text-anchor="middle" font-size="10" fill="#b91c1c" font-weight="600">validate input</text>
  <circle cx="310" cy="532" r="2.5" fill="#cbd5e1"/>
  <text x="450" y="535" text-anchor="middle" font-size="10" fill="#6d28d9" font-weight="600">route &amp; monitor</text>
  <circle cx="575" cy="532" r="2.5" fill="#cbd5e1"/>
  <text x="710" y="535" text-anchor="middle" font-size="10" fill="#c2410c" font-weight="600">scan output</text>
  <circle cx="835" cy="532" r="2.5" fill="#cbd5e1"/>
  <text x="970" y="535" text-anchor="middle" font-size="10" fill="#1d4ed8" font-weight="600">isolate &amp; enforce</text>
  <circle cx="1095" cy="532" r="2.5" fill="#cbd5e1"/>
  <text x="1230" y="535" text-anchor="middle" font-size="10" fill="#047857" font-weight="600">detect &amp; respond</text>

  <!-- Animated data flow pulses -->
  <circle r="7" fill="white" stroke="#334155" stroke-width="2.5" opacity="0.85">
    <animateMotion dur="4.5s" repeatCount="indefinite"
      path="M46,286 L80,286 L190,298 L300,298 L340,298 L450,298 L560,298 L600,298 L710,298 L820,298 L860,298 L970,298 L1080,298 L1120,298 L1230,298 L1340,298"/>
    <animate attributeName="r" values="5;9;5" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="white" stroke="#334155" stroke-width="2.5" opacity="0.85">
    <animateMotion dur="4.5s" repeatCount="indefinite" begin="2.25s"
      path="M46,286 L80,286 L190,298 L300,298 L340,298 L450,298 L560,298 L600,298 L710,298 L820,298 L860,298 L970,298 L1080,298 L1120,298 L1230,298 L1340,298"/>
    <animate attributeName="r" values="5;9;5" dur="4.5s" repeatCount="indefinite" begin="2.25s"/>
    <animate attributeName="opacity" values="0.9;0.35;0.9" dur="4.5s" repeatCount="indefinite" begin="2.25s"/>
  </circle>

  <!-- Connector pulses -->
  <circle r="5" fill="#7c3aed" opacity="0.6">
    <animateMotion dur="1s" repeatCount="indefinite" begin="0.2s" path="M300,298 L340,298"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="1s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle r="5" fill="#ea580c" opacity="0.6">
    <animateMotion dur="1s" repeatCount="indefinite" begin="0.4s" path="M560,298 L600,298"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="1s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle r="5" fill="#2563eb" opacity="0.6">
    <animateMotion dur="1s" repeatCount="indefinite" begin="0.6s" path="M820,298 L860,298"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="1s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle r="5" fill="#059669" opacity="0.6">
    <animateMotion dur="1s" repeatCount="indefinite" begin="0.8s" path="M1080,298 L1120,298"/>
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="1s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- Footer -->
  <text x="700" y="555" text-anchor="middle" font-size="9" fill="#94a3b8" font-weight="400">20 independent security controls — any single bypass does not compromise the system</text>
</svg>
