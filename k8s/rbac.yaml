# RBAC: workspace pods get ZERO permissions, controller gets scoped CRUD
---
# Workspace service account — intentionally has NO role bindings
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-sa
  namespace: devfactory-workspaces
automountServiceAccountToken: false
---
# Controller service account in system namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-controller-sa
  namespace: devfactory-system
---
# Controller role — scoped to pod and service CRUD in workspace namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-controller-role
  namespace: devfactory-workspaces
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-controller-binding
  namespace: devfactory-workspaces
subjects:
  - kind: ServiceAccount
    name: workspace-controller-sa
    namespace: devfactory-system
roleRef:
  kind: Role
  name: workspace-controller-role
  apiGroup: rbac.authorization.k8s.io
